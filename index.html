<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="icon" type="image/png" sizes="512x512" href="calculator.png">
    <link rel="apple-touch-icon" sizes="512x512" href="calculator.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="calculator-header">
            <h1>Calculator</h1>
            <p>Simple & Fast</p>
        </div>

        <input
            id="display"
            type="text"
            placeholder="0"
            readonly
            aria-label="Calculator display"
        >

        <div class="buttons">

            <button class="action" data-action="clear">AC</button>
            <button class="action" data-action="backspace">⌫</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="calculate">=</button>

        </div>

        <p class="keyboard-hint">
            Keyboard supported
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
